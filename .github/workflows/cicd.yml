name: AI Smart Shoe CI-CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tahap-pengujian-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kode Terbaru
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Kita paksa robot menginstall pytest & bandit langsung di sini agar anti-gagal
      - name: Install Alat Pengujian
        run: |
          pip install pytest bandit

      - name: Jalankan Tes Rumus AI
        run: |
          pytest test_system.py

      - name: Scan Keamanan
        run: |
          bandit main.py